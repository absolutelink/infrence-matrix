name: Test, Build and Push Docker Images

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  MATRIX_APP_IMAGE: ${{ github.repository_owner }}/matrix-app
  LLAMA_CPP_IMAGE: ${{ github.repository_owner }}/provider-llama-cpp
  LLAMA_CPP_CUDA12_IMAGE: ${{ github.repository_owner }}/provider-llama-cpp-cuda12

jobs:
  test-admin:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inference
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: inference_matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --frozen --package matrix-admin --package matrix-provider-lib

      - name: Run linter
        working-directory: ./admin/backend
        run: |
          uv run ruff check app
          uv run ruff format --check app

      - name: Run migrations
        working-directory: ./admin/backend
        env:
          POSTGRES_USER: inference
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: inference_matrix_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: uv run bash scripts/prestart.sh

      - name: Run tests
        working-directory: ./admin/backend
        env:
          POSTGRES_USER: inference
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: inference_matrix_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          TEST_DATABASE_URL: postgresql+psycopg://inference:testpassword@localhost:5432/inference_matrix_test
          REDIS_URL: redis://localhost:6379/0
          TEST_REDIS_URL: redis://localhost:6379/15
          FASTAPI_ENV: development
        run: uv run pytest tests/ -v --tb=short

  test-provider:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --frozen --package matrix-provider-mock

      - name: Run linter
        run: |
          uv run ruff check provider/lib provider/mock
          uv run ruff format --check provider/lib provider/mock

      - name: Run provider-lib tests
        env:
          MACHINE_UID: test-machine
          PROVIDER_REGISTRATION_TOKEN: test-token
          ADMIN_BASE_URL: http://localhost:8000
          CACHE_DIR: /tmp/cache
          MODELS_DIR: /tmp/models
        working-directory: ./provider/lib
        run: uv run pytest -v --tb=short

      - name: Run mock provider tests
        env:
          MACHINE_UID: test-machine
          PROVIDER_REGISTRATION_TOKEN: test-token
          ADMIN_BASE_URL: http://localhost:8000
          CACHE_DIR: /tmp/cache
          MODELS_DIR: /tmp/models
        working-directory: ./provider/mock
        run: uv run pytest -v --tb=short

      - name: Run llama-cpp provider tests
        env:
          MACHINE_UID: test-machine
          PROVIDER_REGISTRATION_TOKEN: test-token
          ADMIN_BASE_URL: http://localhost:8000
          CACHE_DIR: /tmp/cache
          MODELS_DIR: /tmp/models
        working-directory: ./provider/llama-cpp
        run: uv run pytest -v --tb=short

  build-matrix-app:
    needs: [test-admin, test-provider]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.MATRIX_APP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Matrix App image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  build-provider-llama-cpp:
    needs: [test-admin, test-provider]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.LLAMA_CPP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push llama-cpp (Vulkan) provider image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./provider/llama-cpp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  build-provider-llama-cpp-cuda12:
    # Disabled: CUDA12 image builds keep failing in GHA; re-enable once
    # stable. The image is still buildable manually — see the comment in
    # provider/llama-cpp/Dockerfile.cuda12.
    if: false
    needs: [test-admin, test-provider]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.LLAMA_CPP_CUDA12_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push llama-cpp (CUDA 12) provider image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./provider/llama-cpp/Dockerfile.cuda12
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # Per-provider-type images: ONLY llama-cpp is built in CI — Vulkan
  # (ghcr.io/ggml-org/llama.cpp:full-vulkan) is built; CUDA 12
  # (ghcr.io/ggml-org/llama.cpp:server-cuda12) builds layers the provider
  # package on the official base the same way but its CI job is currently
  # disabled (see build-provider-llama-cpp-cuda12). gufo /
  # halogen / halogen-flash gate on NPU/ROCm hardware and ship their
  # binaries out-of-band (see provider/<type>/Dockerfile); their CI builds
  # land with the real hardware types. The mock provider is built locally
  # via compose.
