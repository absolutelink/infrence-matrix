name: Test, Build and Push Docker Images

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  MATRIX_APP_IMAGE: ${{ github.repository_owner }}/matrix-app
  AGENT_IMAGE: ${{ github.repository_owner }}/agent

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inference
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: inference_matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen

      - name: Run linter
        working-directory: ./backend
        run: |
          uv run ruff check app
          uv run ruff format --check app

      - name: Run migrations
        working-directory: ./backend
        env:
          POSTGRES_USER: inference
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: inference_matrix_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: uv run bash scripts/prestart.sh

      - name: Run tests
        working-directory: ./backend
        env:
          POSTGRES_USER: inference
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: inference_matrix_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          # Skip the frontend build dir check in app/main.py (frontend/ is
          # gitignored and absent in CI); fastapi reads this env var directly
          FASTAPI_ENV: development
        run: uv run pytest tests/ -v --tb=short

  test-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: ./agent
        run: uv sync --frozen

      - name: Run linter
        working-directory: ./agent
        run: uv run ruff check app

      - name: Run tests
        working-directory: ./agent
        env:
          AGENT_ID: test-agent
          FRONTEND_URL: http://localhost:8000
          MODELS_PATH: /tmp/models
        run: uv run pytest tests/ -v --tb=short

  build-matrix-app:
    needs: [test-backend, test-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MATRIX_APP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Matrix App image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  build-agent:
    needs: [test-backend, test-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./agent/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  build-recipes:
    needs: build-agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get agent image tag
        id: agent-tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=${{ env.REGISTRY }}/${{ env.AGENT_IMAGE }}:main" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ env.REGISTRY }}/${{ env.AGENT_IMAGE }}:${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for recipe image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE }}-vulkan
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Vulkan Recipe image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./recipes/llama-cpp-vulkan/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            AGENT_IMAGE=${{ steps.agent-tag.outputs.tag }}