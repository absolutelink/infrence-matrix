name: Test, Build and Push Docker Images

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  MATRIX_APP_IMAGE: ${{ github.repository_owner }}/matrix-app
  LLAMA_CPP_IMAGE: ${{ github.repository_owner }}/provider-llama-cpp
  LLAMA_CPP_CUDA12_IMAGE: ${{ github.repository_owner }}/provider-llama-cpp-cuda12
  HALOGEN_FLASH_IMAGE: ${{ github.repository_owner }}/provider-halogen-flash

jobs:
  test-admin:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inference
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: inference_matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --frozen --package matrix-admin --package matrix-provider-lib

      - name: Run linter
        working-directory: ./admin/backend
        run: |
          uv run ruff check app
          uv run ruff format --check app

      - name: Run migrations
        working-directory: ./admin/backend
        env:
          POSTGRES_USER: inference
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: inference_matrix_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: uv run bash scripts/prestart.sh

      - name: Run tests
        working-directory: ./admin/backend
        env:
          POSTGRES_USER: inference
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: inference_matrix_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          TEST_DATABASE_URL: postgresql+psycopg://inference:testpassword@localhost:5432/inference_matrix_test
          REDIS_URL: redis://localhost:6379/0
          TEST_REDIS_URL: redis://localhost:6379/15
          FASTAPI_ENV: development
        run: uv run pytest tests/ -v --tb=short

  test-provider:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --frozen --package matrix-provider-mock --package matrix-provider-halogen-flash --package matrix-provider-talkies

      - name: Run linter
        run: |
          uv run ruff check provider/lib provider/mock provider/halogen-flash provider/talkies
          uv run ruff format --check provider/lib provider/mock provider/halogen-flash provider/talkies

      - name: Run provider-lib tests
        env:
          MACHINE_UID: test-machine
          MACHINE_SECRET: test-secret
          AGENT_ID: test-agent
          ADMIN_BASE_URL: http://localhost:8000
          CACHE_DIR: /tmp/cache
          MODELS_DIR: /tmp/models
        working-directory: ./provider/lib
        run: uv run pytest -v --tb=short

      - name: Run mock provider tests
        env:
          MACHINE_UID: test-machine
          MACHINE_SECRET: test-secret
          AGENT_ID: test-agent
          ADMIN_BASE_URL: http://localhost:8000
          CACHE_DIR: /tmp/cache
          MODELS_DIR: /tmp/models
        working-directory: ./provider/mock
        run: uv run pytest -v --tb=short

      - name: Run llama-cpp provider tests
        env:
          MACHINE_UID: test-machine
          MACHINE_SECRET: test-secret
          AGENT_ID: test-agent
          ADMIN_BASE_URL: http://localhost:8000
          CACHE_DIR: /tmp/cache
          MODELS_DIR: /tmp/models
        working-directory: ./provider/llama-cpp
        run: uv run pytest -v --tb=short

      - name: Run halogen-flash provider tests
        env:
          MACHINE_UID: test-machine
          MACHINE_SECRET: test-secret
          AGENT_ID: test-agent
          ADMIN_BASE_URL: http://localhost:8000
          CACHE_DIR: /tmp/cache
          MODELS_DIR: /tmp/models
        working-directory: ./provider/halogen-flash
        run: uv run pytest -v --tb=short

      - name: Run talkies provider tests
        env:
          MACHINE_UID: test-machine
          MACHINE_SECRET: test-secret
          AGENT_ID: test-agent
          ADMIN_BASE_URL: http://localhost:8000
          CACHE_DIR: /tmp/cache
          MODELS_DIR: /tmp/models
        working-directory: ./provider/talkies
        run: uv run pytest -v --tb=short

  build-matrix-app:
    needs: [test-admin, test-provider]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.MATRIX_APP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Matrix App image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  build-provider-llama-cpp:
    needs: [test-admin, test-provider]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.LLAMA_CPP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push llama-cpp (Vulkan) provider image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./provider/llama-cpp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  build-provider-llama-cpp-cuda12:
    # CUDA12 image bakes the NVIDIA userspace driver (RPM Fusion) into the
    # image so it runs without the NVIDIA Container Toolkit. The baked driver
    # version (NVIDIA_DRIVER_BRANCH / NVIDIA_VERSION) must match the provider
    # host's kernel driver — bump these build-args when the host driver moves.
    # See provider/llama-cpp/Dockerfile.cuda12.
    needs: [test-admin, test-provider]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.LLAMA_CPP_CUDA12_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push llama-cpp (CUDA 12) provider image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./provider/llama-cpp/Dockerfile.cuda12
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            NVIDIA_DRIVER_BRANCH=580
            NVIDIA_VERSION=580.178.04

  build-provider-halogen-flash:
    needs: [test-admin, test-provider]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.HALOGEN_FLASH_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push halogen-flash provider image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./provider/halogen-flash/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # Per-provider-type images: llama-cpp and halogen-flash are built in CI.
  # Vulkan (ghcr.io/ggml-org/llama.cpp:full-vulkan) is built; CUDA 12
  # (ghcr.io/ggml-org/llama.cpp:full-cuda12) builds layers the provider
  # package on the official base the same way and additionally bakes the
  # NVIDIA userspace driver + nvidia-smi (RPM Fusion builder stage) so it
  # runs without the Container Toolkit (see build-provider-llama-cpp-cuda12).
  # gufo /
  # halogen gates on ROCm hardware and ships its binary out-of-band (see
  # provider/<type>/Dockerfile); its CI build lands with the real hardware
  # type. halogen-flash's provider image is hardware-independent; the
  # halogen-flash server binary remains deployment-supplied. The mock
  # provider is built locally via compose.
