name: Build Vulkan llama.cpp Recipe

on:
  push:
    branches: [main, develop]
    paths:
      - 'recipes/llama-cpp-vulkan/**'
  pull_request:
    branches: [main]
    paths:
      - 'recipes/llama-cpp-vulkan/**'

env:
  REGISTRY: ghcr.io
  VULKAN_RECIPE_IMAGE: ${{ github.repository_owner }}/agent-llama-cpp-vulkan

jobs:
  build-vulkan-recipe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.VULKAN_RECIPE_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Vulkan Recipe image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./recipes/llama-cpp-vulkan/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1