[project]
name = "matrix-admin"
version = "0.1.0"
description = "Inference Matrix admin: broker, scheduler, provider registry"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "pydantic>2.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "alembic>=1.19.1,<2.0.0",
    "sqlmodel>=0.0.39,<1.0.0",
    "psycopg[binary]>=3.3.6",
    "httpx<1.0.0,>=0.25.1",
    "websockets>=12.0",
    "litellm>=1.103.2,<2.0.0",
    "redis>=5.0.0,<7.0.0",
    "psutil>=5.9.0,<7.0.0",
    "huggingface_hub>=0.20.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "pytest-asyncio<1.0.0,>=0.21.0",
    "ruff<1.0.0,>=0.2.2",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
