[project]
name = "inference-matrix-agent"
version = "0.1.0"
description = "Inference Matrix Agent Service - Manages llama.cpp servers on inference hardware"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi>=0.141.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "websockets>=12.0,<13.0",
    "huggingface_hub>=0.20.0,<1.0.0",
    "psutil>=5.9.0,<7.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "ruff>=0.2.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
]

[tool.ruff]
target-version = "py314"

[tool.mypy]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
