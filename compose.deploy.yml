services:
  # Production overlay with Traefik TLS termination.
  # Run: docker compose -f compose.yml -f compose.deploy.yml up -d
  # Requires DOMAIN env var.

  proxy:
    restart: always
    image: traefik:v3.7
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-certificates:/certificates
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --entrypoints.https.address=:443
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --accesslog
      - --log

  admin:
    restart: always
    labels:
      - traefik.http.routers.admin-https.rule=Host(`${DOMAIN:?Variable not set}`)
      - traefik.http.routers.admin-https.entrypoints=https
      - traefik.http.routers.admin-https.tls=true
      - traefik.http.routers.admin-https.tls.certresolver=le

volumes:
  traefik-certificates:
