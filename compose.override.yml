services:
  # Local development overlay. Run: docker compose -f compose.yml -f compose.override.yml up

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - fastapi
      - dev
      - --host
      - "0.0.0.0"
    environment:
      FASTAPI_ENV: "development"
      POSTGRES_HOST: postgres
      REDIS_URL: redis://default:${REDIS_PASSWORD:-}@redis:6379/0
    develop:
      watch:
        - path: ./admin/backend
          action: sync
          target: /app/admin/backend
          ignore:
            - .venv
        - path: ./admin/backend/pyproject.toml
          action: rebuild
