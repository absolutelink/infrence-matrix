services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inference
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changethis}
      POSTGRES_DB: inference_matrix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inference"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Service (WebUI + API on same port)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"  # Both WebUI and API
    environment:
      - DATABASE_URL=postgresql+psycopg://inference:${POSTGRES_PASSWORD:-changethis}@postgres/inference_matrix
      - SECRET_KEY=${SECRET_KEY:-changethisverylongsecretkey}
      - API_KEY_AUTH_ENABLED=${API_KEY_AUTH_ENABLED:-false}
      - AGENT_DISCOVERY_ENABLED=true
    volumes:
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Agent Service (Inference Hardware)
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AGENT_ID=${AGENT_ID:-agent-1}
      - AGENT_NAME=${AGENT_NAME:-GPU-Agent-1}
      - FRONTEND_URL=http://frontend:8000
      - LLAMA_SERVER_PATH=/usr/local/bin/llama-server
      - DEFAULT_GPU_LAYERS=${DEFAULT_GPU_LAYERS:-35}
      - MODELS_PATH=/models
      - CACHE_PATH=/cache
    volumes:
      - ./models:/models
      - ./cache:/cache
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - frontend

volumes:
  postgres_data:
  models:
  cache:
