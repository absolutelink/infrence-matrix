  #   build:
  #     context: .
  #     dockerfile: provider/llama-cpp/Dockerfile
  #   restart: unless-stopped
  #   ports:
  #     - "8083:8081"
  #   environment:
  #     - MACHINE_UID=<machine-uid>
  #     - MACHINE_SECRET=<machine-registration-secret>
  #     - AGENT_ID=<llama-cpp-agent-1>
  #     - ADMIN_BASE_URL=http://admin:8000
  #     - PROVIDER_PORT=8081
  #     - CACHE_DIR=/cache
  #     - MODELS_DIR=/models
  #     - LLAMA_SERVER_PATH=/app/llama-server   # default in the image
  #     - METRICS_CATEGORIES=gpu_usage vram os_ram cpu storage
  #   volumes:
  #     - /dev/dri:/dev/dri               # Mesa/AMD/Intel compute devices
  #     - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro  # ICDs
  #     - llama_cache:/cache
