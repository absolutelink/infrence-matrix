services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inference
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changethis}
      POSTGRES_DB: inference_matrix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inference"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis: scheduler queues, VRAM ledger, metrics ownership registry
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # REDIS_PASSWORD (optional): empty = no auth (local dev default).
    # Set it in .env for a deployed stack; the admin's REDIS_URL below
    # picks it up. REDISCLI_AUTH lets the healthcheck authenticate.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--save", "60", "1", "--loglevel", "warning"]
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Admin: FastAPI backend + React UI (served under /admin) in one container
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_ENV=production
      - POSTGRES_USER=inference
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changethis}
      - POSTGRES_DB=inference_matrix
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      # With REDIS_PASSWORD set (redis --requirepass above) the credentials
      # ride in the URL as redis://default:<pw>@redis:6379/0 (the
      # "default" username is the ACL default user).
      - REDIS_URL=redis://default:${REDIS_PASSWORD:-}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock provider: full-path local development with no hardware.
  # The provider dials the admin WS; admin points litellm back at :8081.
  provider-mock:
    build:
      context: .
      dockerfile: provider/mock/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - MACHINE_UID=${MOCK_MACHINE_UID:-mock-machine-1}
      - PROVIDER_REGISTRATION_TOKEN=${MOCK_PROVIDER_TOKEN:-mock-registration-token}
      - ADMIN_BASE_URL=http://admin:8000
      - PROVIDER_PORT=8081
      - CACHE_DIR=/cache
      - MODELS_DIR=/models
      - METRICS_CATEGORIES=gpu_usage vram os_ram cpu storage
    volumes:
      - mock_cache:/cache
      - mock_models:/models
    depends_on:
      admin:
        condition: service_healthy

  # ── Hardware provider examples (Phase 8) ──────────────────────────────
