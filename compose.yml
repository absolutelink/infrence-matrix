services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inference
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changethis}
      POSTGRES_DB: inference_matrix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inference"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis: scheduler queues, VRAM ledger, metrics ownership registry
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # REDIS_PASSWORD (optional): empty = no auth (local dev default).
    # Set it in .env for a deployed stack; the admin's REDIS_URL below
    # picks it up. REDISCLI_AUTH lets the healthcheck authenticate.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--save", "60", "1", "--loglevel", "warning"]
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Admin: FastAPI backend + React UI (served under /admin) in one container
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_ENV=production
      - POSTGRES_USER=inference
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changethis}
      - POSTGRES_DB=inference_matrix
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      # With REDIS_PASSWORD set (redis --requirepass above) the credentials
      # ride in the URL as redis://default:<pw>@redis:6379/0 (the
      # "default" username is the ACL default user).
      - REDIS_URL=redis://default:${REDIS_PASSWORD:-}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Phase 17 two-agent GPU-split demo ────────────────────────────────
  # The default single mock agent (provider-mock) reports BOTH fake GPUs
  # (mock-gpu-1 + mock-gpu-2 = 48 GiB), which already exercises the admin's
  # union-by-uuid + auto-sum of machine.total_vram_bytes.
  #
  # To demonstrate a DEVICE-ISOLATED split — two agents on one machine, each
  # pinned to a single GPU — activate the `two-gpu` profile and pin the primary
  # agent to mock-gpu-1:
  #
  #   MOCK_ASSIGNED_GPU_UUIDS=mock-gpu-1 docker compose --profile two-gpu up
  #
  # provider-mock then reports only mock-gpu-1 (24 GiB) and provider-mock-2
  # (profile two-gpu) reports only mock-gpu-2 (24 GiB); the admin merges the two
  # per-agent metrics partials + registration hardware back to 2 GPUs / 48 GiB.
  # With the profile OFF, provider-mock-2 never starts and provider-mock's empty
  # ASSIGNED_GPU_UUIDS keeps the default behavior byte-identical.
  #
  # Mock provider: full-path local development with no hardware.
  # The provider dials the admin WS; admin points litellm back at :8081.
  # Phase 16: an agent authenticates with the machine's shared secret and a
  # stable AGENT_ID; the definition is created TYPED (provider_type +
  # backend_config) in the admin UI/API — there is no per-definition token.
  provider-mock:
    build:
      context: .
      dockerfile: provider/mock/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - MACHINE_UID=${MOCK_MACHINE_UID:-mock-machine-1}
      - MACHINE_SECRET=${MOCK_MACHINE_SECRET:?set MOCK_MACHINE_SECRET to the machine's registration_secret}
      - AGENT_ID=${MOCK_AGENT_ID:-mock-agent-1}
      - ADMIN_BASE_URL=http://admin:8000
      - PROVIDER_PORT=8081
      - CACHE_DIR=/cache
      - MODELS_DIR=/models
      - METRICS_CATEGORIES=gpu_usage vram os_ram cpu storage
      # Phase 17: empty (default) => report every fake GPU (both / 48 GiB).
      # Set MOCK_ASSIGNED_GPU_UUIDS=mock-gpu-1 with the two-gpu profile to pin
      # this agent to a single GPU (device-isolated split demo).
      - ASSIGNED_GPU_UUIDS=${MOCK_ASSIGNED_GPU_UUIDS:-}
    volumes:
      - mock_cache:/cache
      - mock_models:/models
    depends_on:
      admin:
        condition: service_healthy

  # Second mock agent (Phase 17 two-gpu profile): same machine, distinct
  # AGENT_ID + base port (8082 avoids the admin port-conflict guard), pinned to
  # the other fake GPU. Own cache/models volumes so its provider_config.json
  # never collides with provider-mock's.
  provider-mock-2:
    profiles: ["two-gpu"]
    build:
      context: .
      dockerfile: provider/mock/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - MACHINE_UID=${MOCK_MACHINE_UID:-mock-machine-1}
      - MACHINE_SECRET=${MOCK_MACHINE_SECRET:?set MOCK_MACHINE_SECRET to the machine's registration_secret}
      - AGENT_ID=${MOCK_AGENT_ID_2:-mock-agent-2}
      - ADMIN_BASE_URL=http://admin:8000
      - PROVIDER_PORT=8082
      - CACHE_DIR=/cache
      - MODELS_DIR=/models
      - METRICS_CATEGORIES=gpu_usage vram os_ram cpu storage
      - ASSIGNED_GPU_UUIDS=${MOCK_ASSIGNED_GPU_UUIDS_2:-mock-gpu-2}
    volumes:
      - mock2_cache:/cache
      - mock2_models:/models
    depends_on:
      admin:
        condition: service_healthy

  # ── Hardware provider examples (Phase 8) ──────────────────────────────
  # These need real engines/hardware and are NOT started by default.
  # Uncomment on a machine that provides the backend binary (see each
  # provider Dockerfile note: real-engine images layer the binary onto
  # this package image, or mount it and set <TYPE>_SERVER_PATH).
  # Create the Machine (uid) + a TYPED ProviderDefinition (provider_type
  # + backend_config) in the admin UI first; deploy admin before providers
  # (version hard-fail).
