[project]
name = "matrix-provider-lib"
version = "0.1.0"
description = "Shared library for Inference Matrix provider instances"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "psutil>=5.9.0",
    "huggingface_hub[hf_xet]>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["provider_lib"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
ignore = ["E501", "B008", "W191", "B904"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
