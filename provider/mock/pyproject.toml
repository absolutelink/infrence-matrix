[project]
name = "matrix-provider-mock"
version = "0.1.0"
description = "Mock Inference Matrix provider: full-path local development with no hardware"
requires-python = ">=3.14,<4.0"
dependencies = [
    "matrix-provider-lib",
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["provider_mock"]

[tool.uv.sources]
matrix-provider-lib = { workspace = true }

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
ignore = ["E501", "B008", "W191", "B904"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
